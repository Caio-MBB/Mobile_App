<ion-header>
  <ion-toolbar>
    <ion-title>{{overview}}</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/home">
        <ion-icon name="home"></ion-icon>
      </ion-button>
      <ion-button routerLink="/favourites">
        <ion-icon name="heart"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <p>{{overview}}</p>

  <ion-button *ngIf="!isFavourite" (click)="addToFavourites()">
    Add To Favourites
  </ion-button>
  <ion-button *ngIf="isFavourite" (click)="removeFromFavourites()">
    Remove From Favourites
  </ion-button>
  
  <h2>Cast</h2>
  <ion-list>
    <ion-item *ngFor="let member of cast">
      <ion-label>{{member.id}}</ion-label>
      <img *ngIf="member.profile_path"[src]="'https://image.tmdb.org/t/p/w200' + member.profile_path"/>
      <p *ngIf="!member.profile_path">No image</p>
      <ion-label>{{member.character}}</ion-label>
    </ion-item>
  </ion-list>
  <h2>Crew</h2>
  <ion-list>
    <ion-item *ngFor="let member of crew">
      <ion-label>{{member.id}}</ion-label>
      <img *ngIf="member.profile_path"[src]="'https://image.tmdb.org/t/p/w200' + member.profile_path"/>
      <p *ngIf="!member.profile_path">No image</p>
      <ion-label>{{member.job}}</ion-label>
    </ion-item>
  </ion-list>

</ion-content>
